name: 定时触发测试-10点05

on:
  schedule:
    # 临时测试：北京时间 10:05（UTC 02:05）
    - cron: '5 2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger-daily-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: 显示触发信息
        run: |
          echo "event=${{ github.event_name }}"
          TZ='Asia/Shanghai' date '+Beijing time: %Y-%m-%d %H:%M:%S'

      - name: 触发每日股票分析
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '00-daily-analysis.yml',
              ref: 'main',
              inputs: {
                mode: 'full',
                force_run: 'false'
              }
            })
